<div class="settings-container">
    <h2>Uživatelská nastavení</h2>
    <form id="settingsForm">
        <div class="form-section">
            <label for="baseCurrencySelect">Základní měna:</label>
            <select id="baseCurrencySelect">
                <option value="CZK">CZK</option>
                <option value="EUR" selected>EUR</option>
                <option value="USD">USD</option>
                <option value="GBP">GBP</option>
            </select>
        </div>

        <div class="form-section">
            <label>Sledované měny:</label>
            <div class="checkbox-group" id="symbolsGroup">
                <label><input type="checkbox" value="CZK"> CZK</label>
                <label><input type="checkbox" value="USD" checked> USD</label>
                <label><input type="checkbox" value="GBP" checked> GBP</label>
                <label><input type="checkbox" value="PLN"> PLN</label>
                <label><input type="checkbox" value="HUF"> HUF</label>
            </div>
        </div>

        <button type="submit" class="btn-success">Uložit nastavení</button>
    </form>
</div>
