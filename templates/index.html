<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exchange Analyzer</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div id="app">
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2>Exchange App</h2>
            </div>
            <nav>
                <button onclick="showSection('dashboard')" class="nav-link active" id="nav-dashboard">
                    <i>📊</i> Dashboard
                </button>
                <button onclick="showSection('settings')" class="nav-link" id="nav-settings">
                    <i>⚙️</i> Nastavení
                </button>
            </nav>
            <div class="sidebar-footer">
                <button onclick="logout()" class="btn-logout">Odhlásit se</button>
            </div>
        </aside>

        <main class="content">
            <header class="top-bar">
                <h1 id="section-title">Přehled kurzů</h1>
                <div class="lang-switch">
                    <button id="lang-cs" onclick="switchLanguage('cs')" class="btn-lang">🇨🇿 CZ</button>
                    <button id="lang-en" onclick="switchLanguage('en')" class="btn-lang">🇬🇧 EN</button>
                </div>
            </header>

            <section id="dashboard-section" class="app-section">
                <div class="stats-grid">
                    <div class="stat-card">
                        <span class="stat-label" id="lbl-strongest">Nejsilnější měna</span>
                        <div class="stat-value" id="strongestCurrency">-</div>
                    </div>
                    <div class="stat-card">
                        <span class="stat-label" id="lbl-weakest">Nejslabší měna</span>
                        <div class="stat-value" id="weakestCurrency">-</div>
                    </div>
                    <div class="stat-card">
                        <span class="stat-label" id="lbl-avg">Průměrný kurz</span>
                        <div class="stat-value" id="avgRate">-</div>
                    </div>
                </div>

                <div class="card chart-card" style="height: 400px;">
                    <h3>Vizualizace kurzů (vůči <span class="base-currency-tag">---</span>)</h3>
                    <canvas id="rateChart"></canvas>
                </div>

                <div class="card table-card">
                    <table id="currencyTable">
                        <thead>
                            <tr>
                                <th id="th-curr">Měna</th>
                                <th id="th-rate">Hodnota</th>
                            </tr>
                        </thead>
                        <tbody>
                            </tbody>
                    </table>
                </div>
            </section>

            <section id="settings-section" class="app-section" style="display: none;">
                <div class="card settings-card">
                    <form id="settingsForm">
                        <div class="form-group">
                            <label id="lbl-base-curr">Základní měna (Base)</label>
                            <select id="baseCurrencySelect" class="form-control">
                                {% for code, name in all_currencies.items() %}
                                    <option value="{{ code }}" {% if settings.baseCurrency == code %}selected{% endif %}>
                                        {{ code }} - {{ name }}
                                    </option>
                                {% endfor %}
                            </select>
                        </div>

                        <div class="form-group">
                            <label id="lbl-watched-curr">Sledované měny</label>
                            <input type="text" id="currencySearch" class="form-control" placeholder="Hledat měnu...">
                            <div class="currency-grid-container">
                                <div class="symbols-grid" id="symbolsGroup">
                                    {% for code, name in all_currencies.items() %}
                                        <label class="chip" data-name="{{ name|lower }}" data-code="{{ code|lower }}">
                                            <input type="checkbox" value="{{ code }}" 
                                                {% if code in settings.selectedCurrencies %}checked{% endif %}> 
                                            <span class="code">{{ code }}</span>
                                            <span class="full-name">{{ name }}</span>
                                        </label>
                                    {% endfor %}
                                </div>
                            </div>
                        </div>

                        <div class="form-group">
                            <label id="lbl-date-mode">Režim dat</label>
                            <select id="dateMode" onchange="toggleDatePicker()">
                                <option value="latest" selected>Aktuální kurzy</option>
                                <option value="historical">Historické kurzy</option>
                            </select>
                        </div>

                        <div id="datePickerContainer" class="form-group" style="display: none;">
                            <label id="lbl-select-date">Vyberte datum</label>
                            <input type="date" id="historicalDate" max="">
                        </div>

                        <button type="submit" class="btn-save">
                            <span id="btn-save-text">Uložit preference</span>
                        </button>
                    </form>
                </div>
            </section>
        </main>
    </div>
    <script src="{{ url_for('static', filename='main.js') }}"></script>
</body>
</html>
