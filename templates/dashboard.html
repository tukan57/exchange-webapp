<div class="dashboard-header">
    <h2>Aktuální přehled kurzů</h2>
    <div class="base-info">Základní měna: <span id="currentBase">EUR</span></div>
</div>

<div class="stats-grid">
    <div class="stat-card">
        <h3>Nejsilnější měna</h3>
        <p id="strongestCurrency">-</p>
    </div>
    <div class="stat-card">
        <h3>Nejslabší měna</h3>
        <p id="weakestCurrency">-</p>
    </div>
    <div class="stat-card">
        <h3>Průměr (vybrané)</h3>
        <p id="avgRate">-</p>
    </div>
</div>

<div class="chart-container">
    <canvas id="rateChart"></canvas>
</div>

<div class="data-table">
    <h3>Tabulka kurzů</h3>
    <table id="currencyTable">
        <thead>
            <tr>
                <th>Měna</th>
                <th>Kurz</th>
            </tr>
        </thead>
        <tbody>
            </tbody>
    </table>
</div>
